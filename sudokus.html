<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Gris molt suau */
        }

        /* Ocultar les fletxes dels inputs de tipus número */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* Colors únics i agradables per a cada cel·la */
        .bg-cell-1 { background-color: rgb(197, 228, 247); }
        .bg-cell-2 { background-color: rgb(209, 197, 247); }
        .bg-cell-3 { background-color: rgb(247,197,245); } 
        .bg-cell-4 { background-color: rgb(197,247,211); } 
        .bg-cell-5 { background-color: rgb(226,226,226); } 
        .bg-cell-6 { background-color: rgb(247,197,197); } 
        .bg-cell-7 { background-color: rgb(222,247,197); } 
        .bg-cell-8 { background-color: rgb(247,247,197); } 
        .bg-cell-9 { background-color: rgb(247,228,197); } 

        /* Estil general dels inputs */
        .cell-input {
            width: 100%;
            aspect-ratio: 1 / 1;
            font-size: 2.5rem;
            font-weight: 800;
            text-align: center;
            color: #1f2937;
            border-radius: 1rem;
            outline: none;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.5), 0 4px 6px rgba(0,0,0,0.05);
        }

        .cell-input:focus {
            transform: scale(1.05);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.8), 0 10px 15px rgba(0,0,0,0.1);
            z-index: 10;
        }

        /* Animació de sacsejada (error) */
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Transicions de pàgina */
        .page-fade {
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }
        .hidden-page {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            transform: scale(0.95);
            visibility: hidden;
        }
        .active-page {
            opacity: 1;
            transform: scale(1);
            position: relative;
            visibility: visible;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- CONTENIDOR PRINCIPAL -->
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden relative min-h-[500px] flex items-center justify-center p-8">
        
        <!-- PÀGINA 1: L'Enigma (Graella) -->
        <div id="page1" class="page-fade active-page w-full flex flex-col items-center">
            <h1 class="text-3xl font-bold text-gray-800 mb-2 text-center"></h1>
            <p class="text-gray-500 mb-8 text-center text-sm px-4"></p>

            <!-- Graella 3x3 -->
            <div id="grid-container" class="grid grid-cols-3 gap-3 w-64 sm:w-72 mb-8">
                <!-- Generem els inputs manualment per assignar classes de color -->
                <input type="number" id="cell-1" class="cell-input bg-cell-1" min="1" max="9" oninput="limitInput(this)">
                <input type="number" id="cell-2" class="cell-input bg-cell-2" min="1" max="9" oninput="limitInput(this)">
                <input type="number" id="cell-3" class="cell-input bg-cell-3" min="1" max="9" oninput="limitInput(this)">
                <input type="number" id="cell-4" class="cell-input bg-cell-4" min="1" max="9" oninput="limitInput(this)">
                <input type="number" id="cell-5" class="cell-input bg-cell-5" min="1" max="9" oninput="limitInput(this)">
                <input type="number" id="cell-6" class="cell-input bg-cell-6" min="1" max="9" oninput="limitInput(this)">
                <input type="number" id="cell-7" class="cell-input bg-cell-7" min="1" max="9" oninput="limitInput(this)">
                <input type="number" id="cell-8" class="cell-input bg-cell-8" min="1" max="9" oninput="limitInput(this)">
                <input type="number" id="cell-9" class="cell-input bg-cell-9" min="1" max="9" oninput="limitInput(this)">
            </div>

            <!-- Missatge d'error (Ocult per defecte) -->
            <p id="error-message" class="text-red-500 font-semibold mb-4 opacity-0 transition-opacity h-6 text-sm">
                Combinació incorrecta. Torna-ho a provar!
            </p>

            <!-- Botó Comprovar -->
            <button id="check-btn" onclick="checkCombination()" class="bg-gray-900 hover:bg-gray-800 text-white font-semibold py-3 px-10 rounded-full shadow-lg transition-transform transform hover:-translate-y-1 active:translate-y-0 w-full sm:w-auto">
                Comprovar
            </button>
        </div>

        <!-- PÀGINA 2: Missatge d'Èxit (Text) -->
        <div id="page2" class="page-fade hidden-page w-full flex flex-col items-center text-center">
            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-6 shadow-inner">
                <!-- Icona Check SVG -->
                <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            
            <h1 class="text-4xl font-extrabold text-gray-800 mb-4 tracking-tight">Molt bé!</h1>
            
            <div class="space-y-4 text-gray-600 text-lg leading-relaxed px-2 sm:px-6">
                <p>
                    Un altre passa-temps, un dels darrers obstacles d'aquesta cursa. Aquest potser t'és familiar...
                    <a href="https://drive.google.com/drive/folders/19a-UcYhvmLLARtaq8pRkOH5ulg8wJbdW?usp=sharing">Una altra carpeta del drive</a>
                </p>
            </div>

            <!-- Botó per tornar (Opcional, l'he posat perquè es pugui provar de nou) -->
            <button onclick="resetGame()" class="mt-8 text-gray-400 hover:text-gray-700 underline text-sm transition-colors">
                Tornar
            </button>
        </div>

    </div>

    <script>
        // Funció per limitar l'input a un sol dígit de l'1 al 9
        function limitInput(element) {
            // Elimina qualsevol cosa que no sigui un número de l'1 al 9
            element.value = element.value.replace(/[^1-9]/g, '');
            // Limita a 1 sol caràcter
            if (element.value.length > 1) {
                element.value = element.value.slice(0, 1);
            }
        }

        // Funció principal de validació
        function checkCombination() {
            const correctSequence = ['8', '7', '1', '6', '9', '4', '5', '2', '3'];
            let isCorrect = true;
            let currentSequence = [];

            // Recollim els valors dels 9 inputs
            for (let i = 1; i <= 9; i++) {
                const cellValue = document.getElementById(`cell-${i}`).value;
                currentSequence.push(cellValue);
                
                if (cellValue !== correctSequence[i - 1]) {
                    isCorrect = false;
                }
            }

            const errorMsg = document.getElementById('error-message');
            const gridContainer = document.getElementById('grid-container');

            if (isCorrect) {
                // Amagar errors anteriors
                errorMsg.style.opacity = '0';
                
                // Transició cap a la pàgina 2
                const page1 = document.getElementById('page1');
                const page2 = document.getElementById('page2');
                
                page1.classList.remove('active-page');
                page1.classList.add('hidden-page');
                
                // Donar un petit temps perquè l'animació de sortida funcioni abans d'entrar la nova
                setTimeout(() => {
                    page2.classList.remove('hidden-page');
                    page2.classList.add('active-page');
                }, 150);

            } else {
                // Mostrar error visual
                errorMsg.style.opacity = '1';
                
                // Afegir animació de sacsejada
                gridContainer.classList.remove('shake');
                // Force reflow per reiniciar l'animació si es fa clic ràpidament
                void gridContainer.offsetWidth; 
                gridContainer.classList.add('shake');

                // Amagar el missatge d'error al cap d'uns segons
                setTimeout(() => {
                    errorMsg.style.opacity = '0';
                }, 3000);
            }
        }

        // Funció per reiniciar (per si l'usuari vol tornar a provar)
        function resetGame() {
            // Netejar els inputs
            for (let i = 1; i <= 9; i++) {
                document.getElementById(`cell-${i}`).value = '';
            }
            
            // Tornar a la pàgina 1
            const page1 = document.getElementById('page1');
            const page2 = document.getElementById('page2');
            
            page2.classList.remove('active-page');
            page2.classList.add('hidden-page');
            
            setTimeout(() => {
                page1.classList.remove('hidden-page');
                page1.classList.add('active-page');
            }, 150);
        }
    </script>
</body>
</html>
